<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Open Graph / WhatsApp Preview Tags -->
    <meta property="og:title" content="Bayna - Service Provider" />
    <meta property="og:description" content="Professional service provider on Bayna" />
    <meta property="og:image" content="https://contehsaidue.github.io/makit-legal/assets/bayna-white-logo.png" />
    <meta property="og:url" content="https://contehsaidue.github.io/makit-legal/provider.html?id=PROVIDER_ID" />
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Bayna Marketplace" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bayna Service Provider" />
    <meta name="twitter:description" content="View portfolio and services" />
    <meta name="twitter:image" content="https://contehsaidue.github.io/makit-legal/assets/bayna-white-logo.png" />

    <title>Bayna - Service Provider</title>

    <style>
        :root {
            --primary: #10B981;
            --primary-dark: #0F1B2B;
            --primary-light: #ECFDF5;
            --primary-border: #A7F3D0;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --surface-alt: #F1F5F9;
            --border: #E2E8F0;
            --border-soft: #F1F5F9;
            --text: #0F172A;
            --text-muted: #64748B;
            --text-faint: #94A3B8;
            --danger: #DC2626;
            --warning: #D97706;
            --warning-light: #FFFBEB;
            --gold: #D97706;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 22px;
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 20px 35px rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border-soft);
        }

        /* ── Hero ── */
        .image-container {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #0F1B2B 0%, #1E293B 100%);
            overflow: hidden;
            position: relative;
        }

        .provider-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .default-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            opacity: 0.85;
        }

        .verified-ribbon {
            position: absolute;
            top: 16px;
            right: 16px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            background: var(--primary);
            color: #FFFFFF;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            box-shadow: var(--shadow-md);
        }

        /* ── Content ── */
        .content {
            padding: 20px 16px 16px;
        }

        /* Avatar overlapping hero */
        .avatar-wrap {
            margin-top: -48px;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 44px;
            border: 4px solid var(--surface);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 32px;
            font-weight: 800;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Intro / identity block */
        .intro {
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-soft);
        }

        .provider-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .provider-name {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
            line-height: 28px;
        }

        .verified-badge-inline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 9px;
            background: var(--primary);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .category-chip {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .location-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .location-text {
            font-size: 13px;
            color: var(--text-muted);
            flex-shrink: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── Section eyebrow ── */
        .section-eyebrow {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-top: 20px;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        /* ── Summary strip ── */
        .summary-strip {
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 0;
            margin-top: 4px;
        }

        .summary-item {
            flex: 1;
            text-align: center;
        }

        .summary-number {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
        }

        .summary-number.accent {
            color: var(--gold);
        }

        .summary-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 4px;
            letter-spacing: 0.2px;
        }

        .summary-divider {
            width: 1px;
            height: 26px;
            background: var(--border);
        }

        /* ── Trust rows ── */
        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-soft);
        }

        .row:last-child {
            border-bottom: 0;
        }

        .icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }

        .row-body {
            flex: 1;
            min-width: 0;
        }

        .row-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
            margin-bottom: 4px;
        }

        .row-summary {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 18px;
        }

        .row-value {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.2px;
            font-variant-numeric: tabular-nums;
        }

        /* ── Bio ── */
        .bio-block {
            padding: 14px 4px;
            border-bottom: 1px solid var(--border-soft);
        }

        .bio-text {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 21px;
        }

        /* ── Services preview ── */
        .services-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px;
            margin-bottom: 8px;
        }

        .service-chip {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.1px;
        }

        /* ── Rating row ── */
        .rating-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 4px;
            border-bottom: 1px solid var(--border-soft);
        }

        .stars-row {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .star {
            color: var(--gold);
            font-size: 15px;
            line-height: 1;
        }

        .star-dim {
            color: #CBD5E1;
        }

        .rating-value {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
            font-variant-numeric: tabular-nums;
        }

        .rating-count {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* ── Action buttons ── */
        .actions {
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .primary-button {
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: var(--radius-md);
            width: 100%;
            cursor: pointer;
            letter-spacing: -0.2px;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .primary-button:hover {
            background: #0EA271;
        }

        .primary-button:active {
            transform: scale(0.98);
        }

        .secondary-button {
            background: var(--primary-dark);
            color: #FFFFFF;
            border: none;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: var(--radius-md);
            width: 100%;
            cursor: pointer;
            letter-spacing: -0.2px;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .secondary-button:hover {
            background: #1E293B;
        }

        .secondary-button:active {
            transform: scale(0.98);
        }

        /* ── Footer ── */
        .footer {
            background: var(--surface-alt);
            padding: 18px 16px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-soft);
            text-align: center;
        }

        .footer-brand {
            font-size: 13px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.2px;
            margin-bottom: 4px;
        }

        .footer-tagline {
            font-size: 11px;
            color: var(--text-faint);
            letter-spacing: 0.3px;
        }

        /* ── Loading / Error ── */
        .loading {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-muted);
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface-alt);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 48px 24px;
        }

        .error-icon {
            width: 72px;
            height: 72px;
            border-radius: 36px;
            background: var(--surface-alt);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
        }

        .error h2 {
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .error p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 19px;
            margin-bottom: 20px;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            max-width: 408px;
            margin: 0 auto;
            background: var(--primary-dark);
            color: #FFFFFF;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.25s ease-out;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 380px) {
            .content { padding: 16px 12px 12px; }
            .provider-name { font-size: 20px; line-height: 26px; }
            .avatar { width: 80px; height: 80px; }
            .image-container { height: 180px; }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="loading">
            <div class="loader"></div>
            <div>Loading provider details…</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const providerId = urlParams.get('id');

        const API_BASE_URL = 'https://api.bayna-backend-api.tech/api';
        const FALLBACK_LOGO = 'https://contehsaidue.github.io/makit-legal/assets/bayna-white-logo.png';

        async function loadProvider() {
            if (!providerId) {
                showError();
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/service-providers/${providerId}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const provider = await response.json();
                if (!provider || !provider.id) {
                    showError();
                    return;
                }

                renderProvider(provider);

                setTimeout(() => {
                    window.location.href = `makit://view-providers-portfolio/${providerId}`;
                }, 1500);
            } catch (error) {
                console.error('Error loading provider:', error);
                showError();
            }
        }

        function renderProvider(provider) {
            /* ── Image ── */
            let coverImage = FALLBACK_LOGO;
            if (provider.image && /^https?:\/\//.test(provider.image)) {
                coverImage = provider.image;
            } else if (
                provider.businessProfileLogo &&
                /^https?:\/\//.test(provider.businessProfileLogo)
            ) {
                coverImage = provider.businessProfileLogo;
            }

            /* ── Avatar ── */
            let avatarUrl = provider.user?.avatar || provider.businessProfileLogo || '';
            if (avatarUrl && !/^https?:\/\//.test(avatarUrl)) avatarUrl = '';

            /* ── Derived ── */
            const businessName =
                provider.businessName || provider.name || 'Service Provider';
            const userName = provider.user?.name || businessName;
            const category =
                provider.businessCategory || provider.specialty || 'Professional Services';
            const rating = provider.rating || 0;
            const totalReviews =
                provider.totalReviews || provider._count?.reviews || 0;
            const servicesCount =
                provider._count?.services || provider.totalServices || 0;
            const completedJobs =
                provider.servicesCompleted || provider.totalJobs || 0;
            const isVerified = provider.isVerified || false;
            const isFounding = provider.isFounding || false;
            const experience = provider.experience || '1+ years';
            const location =
                provider.location || provider.user?.location || 'Sierra Leone';
            const description =
                provider.description ||
                `${businessName} is a trusted service provider on Bayna, offering quality services to customers across Sierra Leone.`;
            const joinDate = provider.createdAt
                ? new Date(provider.createdAt).toLocaleDateString('en-US', {
                      month: 'long',
                      year: 'numeric',
                  })
                : null;

            const initial = (businessName || 'S').charAt(0).toUpperCase();

            /* ── Meta tags ── */
            document.title = `Bayna - ${businessName}`;
            updateMetaTag('og:title', businessName);
            updateMetaTag(
                'og:description',
                `${rating}★ | ${completedJobs}+ jobs completed | ${servicesCount} services offered`,
            );
            updateMetaTag('og:image', coverImage);
            updateMetaTag(
                'og:url',
                `https://contehsaidue.github.io/makit-legal/provider.html?id=${providerId}`,
            );
            updateMetaTag('twitter:title', businessName);
            updateMetaTag(
                'twitter:description',
                `${rating}★ | ${completedJobs}+ jobs completed`,
            );
            updateMetaTag('twitter:image', coverImage);

            /* ── Stars ── */
            const starsHtml = renderStars(rating, 15);

            /* ── Avatar block ── */
            const avatarHtml = avatarUrl
                ? `<img src="${escapeHtml(avatarUrl)}" alt="${escapeHtml(businessName)}" onerror="this.parentNode.textContent='${escapeHtml(initial)}'">`
                : escapeHtml(initial);

            /* ── Trust rows ── */
            const trustRows = [];
            if (isVerified) {
                trustRows.push(`
                    <div class="row">
                        <div class="icon-wrap">🛡️</div>
                        <div class="row-body">
                            <div class="row-title">Verified provider</div>
                            <div class="row-summary">Identity and business details confirmed by Bayna.</div>
                        </div>
                    </div>`);
            }
            if (isFounding) {
                trustRows.push(`
                    <div class="row">
                        <div class="icon-wrap">🏅</div>
                        <div class="row-body">
                            <div class="row-title">Founding provider</div>
                            <div class="row-summary">One of Bayna's earliest service providers.</div>
                        </div>
                    </div>`);
            }
            if (rating >= 4.5) {
                trustRows.push(`
                    <div class="row">
                        <div class="icon-wrap">⭐</div>
                        <div class="row-body">
                            <div class="row-title">Top rated</div>
                            <div class="row-summary">Consistently rated 4.5 or higher by clients.</div>
                        </div>
                    </div>`);
            }
            if (joinDate) {
                trustRows.push(`
                    <div class="row">
                        <div class="icon-wrap">📅</div>
                        <div class="row-body">
                            <div class="row-title">Member since ${escapeHtml(joinDate)}</div>
                            <div class="row-summary">${escapeHtml(experience)} experience</div>
                        </div>
                    </div>`);
            }

            /* ── Render ── */
            document.getElementById('content').innerHTML = `
                <div class="image-container">
                    <img src="${coverImage}" alt="${escapeHtml(businessName)}" class="provider-image"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="default-icon" style="display:none;">🔧</div>
                    ${isVerified ? `<div class="verified-ribbon">✓ VERIFIED</div>` : ''}
                </div>

                <div class="content">
                    <!-- Avatar -->
                    <div class="avatar-wrap">
                        <div class="avatar">${avatarHtml}</div>
                    </div>

                    <!-- Identity -->
                    <div class="intro">
                        <div class="provider-name-row">
                            <span class="provider-name">${escapeHtml(businessName)}</span>
                            ${isVerified ? `<span class="verified-badge-inline">✓</span>` : ''}
                        </div>
                        <div class="category-chip">${escapeHtml(category)}</div>
                        <div class="location-row">
                            <span style="font-size:12px;">📍</span>
                            <span class="location-text">${escapeHtml(location)}</span>
                        </div>
                    </div>

                    <!-- Overview -->
                    <div class="section-eyebrow">Overview</div>
                    <div class="summary-strip">
                        <div class="summary-item">
                            <div class="summary-number">${servicesCount}</div>
                            <div class="summary-label">Services</div>
                        </div>
                        <div class="summary-divider"></div>
                        <div class="summary-item">
                            <div class="summary-number accent">${rating.toFixed(1)}</div>
                            <div class="summary-label">Rating</div>
                        </div>
                        <div class="summary-divider"></div>
                        <div class="summary-item">
                            <div class="summary-number">${completedJobs}</div>
                            <div class="summary-label">Jobs</div>
                        </div>
                    </div>

                    <!-- Rating -->
                    ${
                        totalReviews > 0
                            ? `
                    <div class="section-eyebrow">Rating</div>
                    <div class="rating-inline">
                        <div class="stars-row">${starsHtml}</div>
                        <span class="rating-value">${rating.toFixed(1)}</span>
                        <span class="rating-count">${totalReviews} review${totalReviews === 1 ? '' : 's'}</span>
                    </div>`
                            : ''
                    }

                    <!-- Trust -->
                    ${
                        trustRows.length
                            ? `<div class="section-eyebrow">Trust Signals</div>${trustRows.join('')}`
                            : ''
                    }

                    <!-- About -->
                    <div class="section-eyebrow">About</div>
                    <div class="bio-block">
                        <p class="bio-text">${escapeHtml(description)}</p>
                    </div>

                    <!-- Services -->
                    <div id="services-section" style="display:none;">
                        <div class="section-eyebrow">Services</div>
                        <div id="services-list" class="services-list"></div>
                    </div>

                    <!-- Actions -->
                    <div class="actions">
                        <button class="primary-button" onclick="openApp()">
                            Open in Bayna App
                        </button>
                        <button class="secondary-button" onclick="downloadApp()">
                            Download Bayna
                        </button>
                    </div>
                </div>

                <div class="footer">
                    <div class="footer-brand">Bayna — The Unified Marketplace</div>
                    <div class="footer-tagline">Buy • Sell • Book Services in Sierra Leone</div>
                </div>
            `;

            fetchServices(providerId);
        }

        async function fetchServices(providerId) {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/service-providers/${providerId}/services?limit=5`,
                );
                if (!response.ok) return;

                const data = await response.json();
                const services = data.services || [];
                if (!services.length) return;

                const html = services
                    .map((s) => {
                        const title =
                            s.title.length > 30 ? s.title.substring(0, 30) + '…' : s.title;
                        return `<span class="service-chip">${escapeHtml(title)}</span>`;
                    })
                    .join('');

                const section = document.getElementById('services-section');
                const list = document.getElementById('services-list');
                if (section && list) {
                    list.innerHTML = html;
                    section.style.display = 'block';
                }
            } catch (error) {
                console.error('Error fetching services:', error);
            }
        }

        function renderStars(rating, size) {
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5;
            let html = '';
            for (let i = 0; i < 5; i++) {
                if (i < full || (i === full && half)) {
                    html += `<span class="star" style="font-size:${size}px;">★</span>`;
                } else {
                    html += `<span class="star star-dim" style="font-size:${size}px;">★</span>`;
                }
            }
            return html;
        }

        function openApp() {
            window.location.href = `makit://view-providers-portfolio/${providerId}`;

            setTimeout(() => {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerText = 'Don\'t have Bayna? Tap "Download Bayna" below';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3500);
            }, 2000);
        }

        function downloadApp() {
            const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);

            if (isIOS) {
                window.location.href = 'https://apps.apple.com/app/idYOUR_APP_ID';
            } else if (isAndroid) {
                window.location.href =
                    'https://play.google.com/store/apps/details?id=com.anonymous.makit';
            } else {
                alert('Download Bayna from your device\'s app store');
            }
        }

        function updateMetaTag(name, content) {
            const meta = document.querySelector(`meta[property="${name}"]`);
            if (meta) meta.setAttribute('content', content);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            }[m]));
        }

        function showError() {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <div class="error-icon">🔧</div>
                    <h2>Provider Not Found</h2>
                    <p>This service provider may not be available or no longer exists.</p>
                    <button class="primary-button"
                            onclick="window.location.href='https://contehsaidue.github.io/makit-legal/'">
                        Visit Bayna
                    </button>
                </div>
                <div class="footer">
                    <div class="footer-brand">Bayna — The Unified Marketplace</div>
                    <div class="footer-tagline">Buy • Sell • Book Services in Sierra Leone</div>
                </div>
            `;
        }

        loadProvider();
    </script>
</body>
</html>
