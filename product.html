<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Open Graph / WhatsApp Preview Tags -->
    <meta property="og:title" content="Bayna Marketplace" />
    <meta property="og:description" content="Bayna : Buy • Sell • Book Services" />
    <meta property="og:image" content="https://contehsaidue.github.io/makit-legal/assets/bayna-white-logo.png" />
    <meta property="og:url" content="https://contehsaidue.github.io/makit-legal/product.html?id=PRODUCT_ID" />
    <meta property="og:type" content="product" />
    <meta property="og:site_name" content="Bayna Marketplace" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bayna Product" />
    <meta name="twitter:description" content="Shop products in Sierra Leone" />
    <meta name="twitter:image" content="https://contehsaidue.github.io/makit-legal/assets/bayna-white-logo.png" />

    <title>Bayna - Product Details</title>

    <style>
        :root {
            --primary: #10B981;
            --primary-dark: #0F1B2B;
            --primary-light: #ECFDF5;
            --primary-border: #A7F3D0;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --surface-alt: #F1F5F9;
            --border: #E2E8F0;
            --border-soft: #F1F5F9;
            --text: #0F172A;
            --text-muted: #64748B;
            --text-faint: #94A3B8;
            --danger: #DC2626;
            --danger-light: #FEF2F2;
            --warning: #D97706;
            --warning-light: #FFFBEB;
            --gold: #D97706;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 22px;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 20px 35px rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border-soft);
        }

        /* ── Hero ── */
        .image-container {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #0F1B2B 0%, #1E293B 100%);
            overflow: hidden;
            position: relative;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .default-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            opacity: 0.85;
        }

        .discount-chip {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: var(--danger);
            color: #FFFFFF;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        /* ── Content ── */
        .content {
            padding: 20px 16px 16px;
        }

        /* Intro / title block */
        .intro {
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-soft);
        }

        .product-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
            line-height: 28px;
            margin-bottom: 10px;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .meta-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        .meta-dot {
            width: 3px;
            height: 3px;
            border-radius: 2px;
            background: #CBD5E1;
            margin: 0 4px;
        }

        .category-chip {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        /* Price strip */
        .price-strip {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding-top: 4px;
        }

        .price-block {
            display: flex;
            flex-direction: column;
        }

        .product-price {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.6px;
            font-variant-numeric: tabular-nums;
        }

        .original-price {
            font-size: 13px;
            color: var(--text-faint);
            text-decoration: line-through;
            font-weight: 600;
            margin-top: 4px;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.6px;
            white-space: nowrap;
        }

        .status-chip.in-stock {
            background: var(--primary-light);
            color: var(--primary);
        }

        .status-chip.out-of-stock {
            background: var(--danger-light);
            color: var(--danger);
        }

        .status-chip.low-stock {
            background: var(--warning-light);
            color: var(--warning);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 3px;
            background: currentColor;
        }

        /* Section eyebrow */
        .section-eyebrow {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-top: 20px;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        /* Seller card */
        .seller-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-soft);
            margin-top: 4px;
        }

        .seller-avatar {
            width: 44px;
            height: 44px;
            border-radius: 22px;
            background: var(--primary);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .seller-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .seller-info {
            flex: 1;
            min-width: 0;
        }

        .seller-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .seller-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 6px;
            border-radius: 6px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.6px;
        }

        .seller-category {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Description */
        .description-block {
            padding: 14px 0;
            border-bottom: 1px solid var(--border-soft);
        }

        .description-text {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 21px;
        }

        /* Specs rows */
        .spec-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 4px;
            border-bottom: 1px solid var(--border-soft);
            gap: 16px;
        }

        .spec-row:last-child {
            border-bottom: 0;
        }

        .spec-label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            flex: 1;
        }

        .spec-value {
            font-size: 14px;
            color: var(--text);
            font-weight: 700;
            flex: 1;
            text-align: right;
        }

        /* Rating summary */
        .rating-block {
            padding: 14px 0 18px;
            border-bottom: 1px solid var(--border-soft);
        }

        .rating-main {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .rating-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.6px;
            line-height: 1;
        }

        .stars-row {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .star {
            color: var(--gold);
            font-size: 16px;
            line-height: 1;
        }

        .star-dim {
            color: #CBD5E1;
        }

        .rating-count {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ── Action buttons ── */
        .actions {
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .primary-button {
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: var(--radius-md);
            width: 100%;
            cursor: pointer;
            letter-spacing: -0.2px;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .primary-button:hover {
            background: #0EA271;
        }

        .primary-button:active {
            transform: scale(0.98);
        }

        .secondary-button {
            background: var(--primary-dark);
            color: #FFFFFF;
            border: none;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: var(--radius-md);
            width: 100%;
            cursor: pointer;
            letter-spacing: -0.2px;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .secondary-button:hover {
            background: #1E293B;
        }

        .secondary-button:active {
            transform: scale(0.98);
        }

        /* ── Footer ── */
        .footer {
            background: var(--surface-alt);
            padding: 18px 16px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-soft);
            text-align: center;
        }

        .footer-brand {
            font-size: 13px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.2px;
            margin-bottom: 4px;
        }

        .footer-tagline {
            font-size: 11px;
            color: var(--text-faint);
            letter-spacing: 0.3px;
        }

        /* ── Loading / Error states ── */
        .loading {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-muted);
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface-alt);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 48px 24px;
        }

        .error-icon {
            width: 72px;
            height: 72px;
            border-radius: 36px;
            background: var(--surface-alt);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
        }

        .error h2 {
            font-size: 17px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .error p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 19px;
            margin-bottom: 20px;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 16px;
            right: 16px;
            max-width: 408px;
            margin: 0 auto;
            background: var(--primary-dark);
            color: #FFFFFF;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.25s ease-out;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 380px) {
            .content { padding: 16px 12px 12px; }
            .product-title { font-size: 20px; line-height: 26px; }
            .product-price { font-size: 24px; }
            .image-container { height: 240px; }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="loading">
            <div class="loader"></div>
            <div>Loading product details…</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        const API_BASE_URL = 'https://api.bayna-backend-api.tech/api';
        const FALLBACK_LOGO = 'https://contehsaidue.github.io/makit-legal/assets/bayna-white-logo.png';

        async function loadProduct() {
            if (!productId) {
                showError();
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/products/${productId}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const product = await response.json();
                if (!product || !product.id) {
                    showError();
                    return;
                }

                renderProduct(product);

                setTimeout(() => {
                    window.location.href = `makit://products/${productId}`;
                }, 1000);
            } catch (error) {
                console.error('Error loading product:', error);
                showError();
            }
        }

        function renderProduct(product) {
            /* ── Image ── */
            let imageUrl = FALLBACK_LOGO;
            if (product.images && product.images.length > 0) {
                const img = product.images[0];
                if (img && (img.startsWith('http://') || img.startsWith('https://'))) {
                    imageUrl = img;
                } else if (img && img.startsWith('/')) {
                    imageUrl = `${API_BASE_URL}${img}`;
                }
            }

            /* ── Derived values ── */
            const price = product.discountedPrice || product.originalPrice || 0;
            const originalPrice = product.originalPrice || price;
            const hasDiscount =
                product.discountedPrice && product.discountedPrice < originalPrice;
            const discountPercent = hasDiscount
                ? Math.round((1 - product.discountedPrice / originalPrice) * 100)
                : 0;
            const rating = product.rating || 0;
            const reviewCount = product.totalReviews || 0;
            const inStock = product.inStock && product.stockQuantity > 0;
            const lowStock = inStock && product.stockQuantity <= 5;
            const sellerName =
                product.seller?.businessName ||
                product.seller?.user?.name ||
                'Verified Seller';
            const sellerCategory =
                product.seller?.businessCategory || product.category?.name || 'Product';
            const sellerAvatar =
                product.seller?.businessProfileLogo ||
                product.seller?.user?.avatar ||
                null;
            const sellerInitial = (sellerName || 'S').charAt(0).toUpperCase();
            const sellerVerified = product.seller?.isVerified || false;

            /* ── Meta tags ── */
            document.title = `Bayna - ${product.title}`;
            updateMetaTag('og:title', product.title);
            updateMetaTag(
                'og:description',
                `Le ${price.toLocaleString()} | ⭐ ${rating}★ (${reviewCount} reviews)`,
            );
            updateMetaTag('og:image', imageUrl);
            updateMetaTag(
                'og:url',
                `https://contehsaidue.github.io/makit-legal/product.html?id=${productId}`,
            );
            updateMetaTag('twitter:title', product.title);
            updateMetaTag(
                'twitter:description',
                `Le ${price.toLocaleString()} | ⭐ ${rating}★`,
            );
            updateMetaTag('twitter:image', imageUrl);

            /* ── Stars ── */
            const starsHtml = renderStars(rating, 16);

            /* ── Status ── */
            let statusClass = 'in-stock';
            let statusText = 'IN STOCK';
            if (!inStock) {
                statusClass = 'out-of-stock';
                statusText = 'OUT OF STOCK';
            } else if (lowStock) {
                statusClass = 'low-stock';
                statusText = `ONLY ${product.stockQuantity} LEFT`;
            }

            /* ── Specs ── */
            const specs = [];
            if (product.condition) {
                specs.push({
                    label: 'Condition',
                    value: formatCondition(product.condition),
                });
            }
            if (product.brand) specs.push({ label: 'Brand', value: product.brand });
            if (product.weight)
                specs.push({ label: 'Weight', value: `${product.weight} kg` });
            if (product.dimensions)
                specs.push({ label: 'Dimensions', value: product.dimensions });
            if (product.stockQuantity !== undefined) {
                specs.push({
                    label: 'Stock Quantity',
                    value: String(product.stockQuantity),
                });
            }

            const specsHtml = specs.length
                ? specs
                      .map(
                          (s) => `
                    <div class="spec-row">
                        <span class="spec-label">${escapeHtml(s.label)}</span>
                        <span class="spec-value">${escapeHtml(s.value)}</span>
                    </div>`,
                      )
                      .join('')
                : '';

            /* ── Seller avatar ── */
            const sellerAvatarHtml = sellerAvatar
                ? `<img src="${escapeHtml(sellerAvatar)}" alt="${escapeHtml(sellerName)}" onerror="this.parentNode.textContent='${escapeHtml(sellerInitial)}'">`
                : escapeHtml(sellerInitial);

            /* ── Render ── */
            document.getElementById('content').innerHTML = `
                <div class="image-container">
                    <img src="${imageUrl}" alt="${escapeHtml(product.title)}" class="product-image"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="default-icon" style="display:none;">🛍️</div>
                    ${hasDiscount ? `<div class="discount-chip">-${discountPercent}%</div>` : ''}
                </div>

                <div class="content">
                    <!-- Title / meta -->
                    <div class="intro">
                        <h1 class="product-title">${escapeHtml(product.title)}</h1>
                        <div class="meta-row">
                            ${
                                product.category?.name
                                    ? `<span class="category-chip">${escapeHtml(product.category.name)}</span>`
                                    : ''
                            }
                            ${
                                sellerCategory && sellerCategory !== product.category?.name
                                    ? `<span class="meta-dot"></span><span class="meta-text">${escapeHtml(sellerCategory)}</span>`
                                    : ''
                            }
                        </div>

                        <div class="price-strip">
                            <div class="price-block">
                                <span class="product-price">Le ${price.toLocaleString()}</span>
                                ${
                                    hasDiscount
                                        ? `<span class="original-price">Le ${originalPrice.toLocaleString()}</span>`
                                        : ''
                                }
                            </div>
                            <span class="status-chip ${statusClass}">
                                <span class="status-dot"></span>
                                ${statusText}
                            </span>
                        </div>
                    </div>

                    <!-- Seller -->
                    <div class="section-eyebrow">Seller</div>
                    <div class="seller-card">
                        <div class="seller-avatar">${sellerAvatarHtml}</div>
                        <div class="seller-info">
                            <div class="seller-name-row">
                                <span class="seller-name">${escapeHtml(sellerName)}</span>
                                ${
                                    sellerVerified
                                        ? `<span class="verified-badge">✓ VERIFIED</span>`
                                        : ''
                                }
                            </div>
                            <div class="seller-category">${escapeHtml(sellerCategory)}</div>
                        </div>
                    </div>

                    <!-- Rating -->
                    ${
                        reviewCount > 0
                            ? `
                    <div class="section-eyebrow">Rating</div>
                    <div class="rating-block">
                        <div class="rating-main">
                            <span class="rating-value">${rating.toFixed(1)}</span>
                            <div>
                                <div class="stars-row">${starsHtml}</div>
                                <div class="rating-count">${reviewCount} review${reviewCount === 1 ? '' : 's'}</div>
                            </div>
                        </div>
                    </div>`
                            : ''
                    }

                    <!-- Description -->
                    ${
                        product.description
                            ? `
                    <div class="section-eyebrow">Description</div>
                    <div class="description-block">
                        <p class="description-text">${escapeHtml(product.description)}</p>
                    </div>`
                            : ''
                    }

                    <!-- Specs -->
                    ${
                        specsHtml
                            ? `
                    <div class="section-eyebrow">Specifications</div>
                    <div>${specsHtml}</div>`
                            : ''
                    }

                    <!-- Actions -->
                    <div class="actions">
                        <button class="primary-button" onclick="openApp()">
                            Open in Bayna App
                        </button>
                        <button class="secondary-button" onclick="downloadApp()">
                            Download Bayna
                        </button>
                    </div>
                </div>

                <div class="footer">
                    <div class="footer-brand">Bayna Marketplace</div>
                    <div class="footer-tagline">Buy • Sell • Book Services in Sierra Leone</div>
                </div>
            `;
        }

        function renderStars(rating, size) {
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5;
            let html = '';
            for (let i = 0; i < 5; i++) {
                if (i < full) {
                    html += `<span class="star" style="font-size:${size}px;">★</span>`;
                } else if (i === full && half) {
                    html += `<span class="star" style="font-size:${size}px;">★</span>`;
                } else {
                    html += `<span class="star star-dim" style="font-size:${size}px;">★</span>`;
                }
            }
            return html;
        }

        function formatCondition(condition) {
            const map = {
                NEW: 'New',
                FAIRLY_USED: 'Fairly Used',
                REFURBISHED: 'Refurbished',
            };
            return map[String(condition).toUpperCase()] || condition;
        }

        function openApp() {
            window.location.href = `makit://products/${productId}`;

            setTimeout(() => {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerText = 'Don\'t have Bayna? Tap "Download Bayna" below';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3500);
            }, 2000);
        }

        function downloadApp() {
            const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);

            if (isIOS) {
                window.location.href = 'https://apps.apple.com/app/idYOUR_APP_ID';
            } else if (isAndroid) {
                window.location.href =
                    'https://play.google.com/store/apps/details?id=com.anonymous.makit';
            } else {
                alert('Download Bayna from your device\'s app store');
            }
        }

        function updateMetaTag(name, content) {
            let meta = document.querySelector(`meta[property="${name}"]`);
            if (meta) meta.setAttribute('content', content);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function (m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;',
                }[m];
            });
        }

        function showError() {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <div class="error-icon">🛍️</div>
                    <h2>Product Not Found</h2>
                    <p>This product may have been removed or is no longer available.</p>
                    <button class="primary-button"
                            onclick="window.location.href='https://contehsaidue.github.io/makit-legal/'">
                        Visit Bayna
                    </button>
                </div>
                <div class="footer">
                    <div class="footer-brand">Bayna — The Unified Marketplace</div>
                    <div class="footer-tagline">Buy • Sell • Book Services in Sierra Leone</div>
                </div>
            `;
        }

        loadProduct();
    </script>
</body>
</html>
